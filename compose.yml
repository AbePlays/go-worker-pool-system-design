services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: workerpool
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d workerpool"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      WORKERS: "8"
      JOB_TIMEOUT: "30"
      DATABASE_URL: "postgres://postgres:postgres@db:5432/workerpool?sslmode=disable"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
